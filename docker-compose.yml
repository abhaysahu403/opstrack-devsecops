services:
  postgres:
    image: postgres:16-alpine
    container_name: opstrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-opstrack}
      POSTGRES_USER: ${DB_USER:-opstrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opstrack}
    ports:
      - "5432:5432"
    volumes:
      - opstrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opstrack} -d ${DB_NAME:-opstrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  opstrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opstrack-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-opstrack}
      DB_USER: ${DB_USER:-opstrack}
      DB_PASSWORD: ${DB_PASSWORD:-opstrack}
      DB_SSLMODE: disable
      SERVER_PORT: 8080
      APP_ENV: development
    ports:
      - "8080:8080"

volumes:
  opstrack_pgdata:
