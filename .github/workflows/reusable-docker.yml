name: Reusable - Docker Build & Image Scan

on:
  workflow_call:
    inputs:
      push-image:
        description: "Push the built image to GHCR (ghcr.io). Off by default; this prototype does not include a GCP/Terraform deployment target - swap in your own registry login step if you need one."
        type: boolean
        default: false
      image-tag-suffix:
        description: "Extra tag to apply in addition to :latest and :<git-sha>, e.g. a version number"
        type: string
        default: ""
      trivy-fail-on-critical-high:
        description: "Fail the workflow if Trivy finds CRITICAL/HIGH severity issues in the built image"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build, Scan & (optionally) Push Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "image_local=opstrack:ci" >> "$GITHUB_OUTPUT"
          echo "image_ghcr=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load into local Docker daemon for scanning)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image_local }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_local }}
          format: json
          output: reports/trivy-image/trivy-image.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Trivy image scan (human-readable table + gate)
        id: gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_local }}
          format: table
          output: reports/trivy-image/trivy-image.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: ${{ inputs.trivy-fail-on-critical-high && '1' || '0' }}
          severity-check: ${{ inputs.trivy-fail-on-critical-high && 'CRITICAL,HIGH' || '' }}

      - name: Render Trivy image report
        if: always()
        run: |
          mkdir -p reports/trivy-image
          status="PASS"
          if [ "${{ steps.gate.outcome }}" = "failure" ]; then status="FAIL"; fi
          python3 scripts/render_report.py \
            --title "Trivy Docker Image Scan" --tool trivy-image --status "$status" \
            --summary "Scanned the built OpsTrack Docker image (${{ steps.meta.outputs.image_local }})." \
            --details-file reports/trivy-image/trivy-image.txt --raw-link trivy-image.json \
            --output reports/trivy-image/index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-trivy-image
          path: reports/trivy-image
          retention-days: 14

      - name: Log in to GHCR
        if: inputs.push-image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag & push image to GHCR
        if: inputs.push-image
        run: |
          IMAGE="${{ steps.meta.outputs.image_ghcr }}"
          SHA="${{ steps.meta.outputs.sha_short }}"
          docker tag "${{ steps.meta.outputs.image_local }}" "$IMAGE:latest"
          docker tag "${{ steps.meta.outputs.image_local }}" "$IMAGE:$SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"
          if [ -n "${{ inputs.image-tag-suffix }}" ]; then
            docker tag "${{ steps.meta.outputs.image_local }}" "$IMAGE:${{ inputs.image-tag-suffix }}"
            docker push "$IMAGE:${{ inputs.image-tag-suffix }}"
          fi
