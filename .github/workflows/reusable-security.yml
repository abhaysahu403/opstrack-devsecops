name: Reusable - Security & Quality Scans

on:
  workflow_call:
    inputs:
      trivy-fail-on-critical-high:
        description: "Fail the workflow if Trivy finds CRITICAL/HIGH severity issues"
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      SONAR_ORGANIZATION:
        required: false
      SNYK_TOKEN:
        required: false

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  gosec:
    name: Gosec (Go security analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Create Gosec report directory
        run: mkdir -p reports/gosec

      - name: Run gosec
        id: run
        run: |
          set +e
          gosec -no-fail -fmt=json -out=reports/gosec/gosec.json ./... > /dev/null 2>reports/gosec/gosec-stderr.txt
          gosec -no-fail -fmt=text ./... > reports/gosec/gosec.txt 2>&1
          issues="$(python3 -c "import json,sys; d=json.load(open('reports/gosec/gosec.json')); print(len(d.get('Issues') or []))" 2>/dev/null || echo unknown)"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
          status="PASS"
          if [ "$issues" != "0" ] && [ "$issues" != "unknown" ]; then status="FAIL"; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Render gosec report
        if: always()
        run: |
          python3 scripts/render_report.py \
            --title "Gosec Security Scan" --tool gosec --status "${{ steps.run.outputs.status || 'FAIL' }}" \
            --summary "${{ steps.run.outputs.issues }} potential issue(s) found across the Go source tree." \
            --details-file reports/gosec/gosec.txt --raw-link gosec.json \
            --output reports/gosec/index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-gosec
          path: reports/gosec
          retention-days: 14

  trivy-fs:
    name: Trivy (filesystem / dependency scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create report directories
        run: mkdir -p reports/trivy-fs

      - name: Run Trivy filesystem scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: reports/trivy-fs/trivy-fs.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: "0"

      - name: Run Trivy filesystem scan (human-readable table + gate)
        id: gate
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: reports/trivy-fs/trivy-fs.txt
          severity: CRITICAL,HIGH,MEDIUM,LOW
          exit-code: ${{ inputs.trivy-fail-on-critical-high && '1' || '0' }}
          severity-check: ${{ inputs.trivy-fail-on-critical-high && 'CRITICAL,HIGH' || '' }}

      - name: Render Trivy filesystem report
        if: always()
        run: |
          mkdir -p reports/trivy-fs
          status="PASS"
          if [ "${{ steps.gate.outcome }}" = "failure" ]; then status="FAIL"; fi
          python3 scripts/render_report.py \
            --title "Trivy Filesystem / Dependency Scan" --tool trivy-fs --status "$status" \
            --summary "Scanned repository filesystem and Go module dependencies. See severity_config in this workflow to make CRITICAL/HIGH findings fail the build." \
            --details-file reports/trivy-fs/trivy-fs.txt --raw-link trivy-fs.json \
            --output reports/trivy-fs/index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-trivy-fs
          path: reports/trivy-fs
          retention-days: 14

  snyk:
    name: Snyk (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check Snyk is configured
        id: check
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Snyk report directory
        run: mkdir -p reports/snyk

      - name: Run Snyk
        id: run
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        uses: snyk/actions/golang@master
        with:
          args: --json-file-output=reports/snyk/snyk.json

      - name: Render Snyk report (configured)
        if: steps.check.outputs.configured == 'true'
        run: |
          status="PASS"
          if [ "${{ steps.run.outcome }}" = "failure" ]; then status="FAIL"; fi
          summary="Snyk dependency scan complete."
          if [ ! -f reports/snyk/snyk.json ]; then
            echo '{"note":"snyk produced no JSON output"}' > reports/snyk/snyk.json
          fi
          python3 scripts/render_report.py \
            --title "Snyk Dependency Scan" --tool snyk --status "$status" \
            --summary "$summary" --raw-link snyk.json --output reports/snyk/index.html

      - name: Render Snyk report (not configured)
        if: steps.check.outputs.configured == 'false'
        run: |
          mkdir -p reports/snyk
          python3 scripts/render_report.py \
            --title "Snyk Dependency Scan" --tool snyk --status "NOT_CONFIGURED" \
            --summary "SNYK_TOKEN secret is not set - this stage is skipped. See README > GitHub Secrets to enable it." \
            --output reports/snyk/index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-snyk
          path: reports/snyk
          retention-days: 14

  sonarcloud:
    name: SonarCloud (code quality)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SonarCloud is configured
        id: check
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download coverage + JUnit inputs
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sonar-inputs
          path: .

      - name: SonarCloud Scan
        id: run
        if: steps.check.outputs.configured == 'true'
        continue-on-error: true
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render SonarCloud report (configured)
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p reports/sonar
          status="PASS"
          if [ "${{ steps.run.outcome }}" = "failure" ]; then status="FAIL"; fi
          cat > reports/sonar/index.html <<HTML
          <!DOCTYPE html><html><head><meta charset="UTF-8"><title>SonarCloud</title></head>
          <body style="font-family:sans-serif;padding:32px;">
          <p><a href="index.html">&larr; back</a></p>
          <h1>SonarCloud Analysis</h1>
          <p>Analysis was submitted to SonarCloud. Full results (issues, hotspots,
          quality gate, duplication) are available on the SonarCloud dashboard:</p>
          <p><a href="https://sonarcloud.io/project/overview?id=abhaysahu403_opstrack-devsecops" target="_blank" rel="noopener">
          Open the SonarCloud project dashboard &rarr;</a></p>
          </body></html>
          HTML
          echo "$status" > reports/sonar/status.txt

      - name: Render SonarCloud report (not configured)
        if: steps.check.outputs.configured == 'false'
        run: |
          mkdir -p reports/sonar
          python3 scripts/render_report.py \
            --title "SonarCloud Analysis" --tool sonar --status "NOT_CONFIGURED" \
            --summary "SONAR_TOKEN secret is not set - this stage is skipped. See README > GitHub Secrets to configure SonarCloud." \
            --output reports/sonar/index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-sonar
          path: reports/sonar
          retention-days: 14
