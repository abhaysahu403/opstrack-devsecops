# SonarCloud configuration for OpsTrack.
#
# This project is analyzed against SonarCloud. Set the following as GitHub
# Actions secrets before the `sonar` stage will do anything:
#
#   SONAR_TOKEN           - Your SonarCloud token from 
#                           https://sonarcloud.io/account/security
#   SONAR_ORGANIZATION    - Your SonarCloud organization key
#
# The SONAR_HOST_URL is automatically set to https://sonarcloud.io by the
# workflow and does not need to be configured as a secret.
#
# If SONAR_TOKEN is absent, the CI workflow skips this stage and marks it
# NOT CONFIGURED in the dashboard/summary instead of failing the build.

sonar.projectKey=abhaysahu403_opstrack-devsecops
sonar.organization=abhaysahu403
sonar.projectName=OpsTrack - Incident & Service Management API
sonar.projectVersion=1.0.0

# Go source root
sonar.sources=cmd,internal
sonar.tests=internal,tests
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/mocks/**,**/vendor/**

# Coverage + test report import (produced by `make coverage` / the CI test stage)
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=reports/unit-tests/test-results.xml

sonar.sourceEncoding=UTF-8
